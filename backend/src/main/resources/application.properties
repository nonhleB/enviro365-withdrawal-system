# --- Server ---
server.port=8080

# --- Application name ---
spring.application.name=enviro365-withdrawal-system

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:enviro365db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (useful for debugging during development)
# Visit http://localhost:8080/h2-console once the app is running
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop: schema is rebuilt from entities every time the app restarts,
# then data.sql (if present) seeds it. Fine for an in-memory demo database.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# --- CORS-friendly logging (helps when debugging frontend<->backend calls) ---
logging.level.org.springframework.web=INFO
